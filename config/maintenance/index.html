<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./favicon.png" />
  <title>Under Construction — Wetfish Online</title>
  <style>
    :root {
      --bg: #05070d;
      --accent: #0ee5a3;
      --accent-dim: #0ee5a340;
      --text: #eaf6ff;
      --muted: #9fb6c7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Satoshi", "Satoshi Variable", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 50% 120%, rgba(14, 229, 163, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 0%, rgba(46, 207, 158, 0.10) 0%, transparent 50%),
        var(--bg);
      padding: 2rem;
      overflow-x: hidden;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      padding: 2rem;
      position: relative;
    }
    .logo {
      display: block;
      max-width: 220px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.5rem;
    }
    .fish {
      display: block;
      max-width: 300px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.75rem;
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.4rem;
      color: #fff;
    }
    h1 span { color: var(--accent); }
    .tagline {
      font-size: 1.1rem;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 1.75rem;
    }
    p strong { color: var(--text); }
    .badge {
      display: inline-block;
      background: var(--accent-dim);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.45rem 1.1rem;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .badge:hover {
      animation: trippy 2s linear infinite;
    }
    @keyframes trippy {
      0% { filter: hue-rotate(0deg); }
      50% { filter: hue-rotate(180deg); }
      100% { filter: hue-rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="wetfish-logo.png" alt="Wetfish logo" />
    <img class="fish" src="under-construction-fish.svg" alt="Under construction fish" />
    <h1>Wetfish <span>Online</span></h1>
    <div class="tagline">The Best Internet on the Internet</div>
    <p>
      The forum is currently <strong>under construction</strong> while we perform a
      planned upgrade. We'll be back swimming shortly &mdash; thanks for your patience!
    </p>
    <span class="badge">Maintenance in progress</span>
  </div>
</body>
</html>
