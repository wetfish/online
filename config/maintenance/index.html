<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction — Wetfish Online</title>
  <style>
    :root {
      --bg: #0b1a2b;
      --panel: #132f4a;
      --text: #d8e6f2;
      --accent: #46b8e6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(ellipse at 50% 0%, #1a3a5c 0%, var(--bg) 70%);
      color: var(--text);
      padding: 2rem;
    }
    .card {
      max-width: 560px;
      width: 100%;
      text-align: center;
      background: var(--panel);
      border: 1px solid rgba(70, 184, 230, 0.25);
      border-radius: 16px;
      padding: 3rem 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    .logo {
      display: block;
      max-width: 240px;
      width: 100%;
      height: auto;
      margin: 0 auto 1.5rem;
      animation: swim 4s ease-in-out infinite;
    }
    @keyframes swim {
      0%, 100% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #fff;
    }
    h1 span { color: var(--accent); }
    p {
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      color: var(--text);
    }
    .badge {
      display: inline-block;
      background: rgba(70, 184, 230, 0.12);
      border: 1px solid var(--accent);
      color: var(--accent);
      border-radius: 999px;
      padding: 0.4rem 1rem;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="wetfish-logo.svg" alt="Wetfish logo" />
    <h1>Wetfish <span>Online</span></h1>
    <p>
      The forum is currently <strong>under construction</strong> while we perform a
      planned upgrade. We'll be back swimming shortly &mdash; thanks for your patience!
    </p>
    <span class="badge">Maintenance in progress</span>
  </div>
</body>
</html>
