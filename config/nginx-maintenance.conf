# Maintenance mode — serves an "under construction" notice for the forum.
#
# To enable:
#   1. Mount ./config/maintenance -> /var/www/maintenance (already in docker-compose.yml)
#   2. Point the online-web nginx mount at this file instead of nginx.conf:
#        - ./config/nginx-maintenance.conf:/etc/nginx/conf.d/default.conf:ro
#   3. docker compose up -d online-web
#
# To disable, revert the mount back to ./config/nginx.conf.

server {
  listen 80;

  root /var/www/maintenance;
  index index.html;

  location / {
    # Serve the maintenance notice for every path (/, /forum/, /forum/index.php, ...)
    try_files $uri /index.html;
  }
}
